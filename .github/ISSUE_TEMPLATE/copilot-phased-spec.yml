name: 🤖 Code Auto By Specs
description: "One long spec split into phases and executed sequentially by Code Auto workflows (label: code auto)."
title: "[CODING] "
labels:
  - "code auto"
body:
  - type: markdown
    attributes:
      value: |
        It is triggered when both conditions are met:
        - Label: `code auto`
        - Assignee: `github-copilot[bot]` (or repo variable `COPILOT_ASSIGNEE`)

        How it works:
        1. Add your full spec below using `## Phase N` sections.
        2. Submit issue.
        3. Assign Copilot to this issue.
        4. Automation creates phase issues and runs them one-by-one.

  - type: textarea
    id: phased_spec
    attributes:
      label: Phased processing plan (required)
      description: "Use simple bullet points for each phase. Keep exact headers `## Phase 1`, `## Phase 2`, ... (minimum: 1 phase)."
      value: |
        ## Phase 1
        - Add a "Submit" button to `Splash.vue`
        - Add click handling for the new button
        - On click, send data to the API

        ## Phase 2
        - Validate input data before calling the API
        - Show a loading state while sending
        - Show success/failure feedback to the user

        ## Phase 3
        - Add tests for the submit flow
        - Verify there is no regression on other screens
        - Update documentation if needed
      render: markdown
    validations:
      required: true
