name: Code Auto - PR Integration

on:
  pull_request:
    types: [closed]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  on-merged-phase-pr:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.base.ref, (vars.PHASE_ACCUM_BRANCH_PREFIX != '' && vars.PHASE_ACCUM_BRANCH_PREFIX || 'auto/spec-'))
    runs-on: ubuntu-latest
    steps:
      - name: Close linked phase issues and cleanup head branch
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pr = context.payload.pull_request;

            const refs = new Set();
            const body = pr.body || '';

            const customRefRegex = /Phase-Issue\s*:\s*#(\d+)/gi;
            const keywordRegex = /(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s*#(\d+)/gi;

            let m;
            while ((m = customRefRegex.exec(body)) !== null) {
              refs.add(Number(m[1]));
            }
            while ((m = keywordRegex.exec(body)) !== null) {
              refs.add(Number(m[1]));
            }

            for (const issueNumber of refs) {
              try {
                const { data: issue } = await github.rest.issues.get({ owner, repo, issue_number: issueNumber });
                const labels = (issue.labels || []).map(l => typeof l === 'string' ? l : l.name);

                if (labels.includes('copilot:phase') && issue.state === 'open') {
                  await github.rest.issues.createComment({
                    owner,
                    repo,
                    issue_number: issueNumber,
                    body: `✅ Closed automatically because PR #${pr.number} was merged into accumulation branch \`${pr.base.ref}\`.`
                  });

                  await github.rest.issues.update({ owner, repo, issue_number: issueNumber, state: 'closed' });
                }
              } catch (e) {
                core.warning(`Cannot process linked issue #${issueNumber}: ${e.message}`);
              }
            }

            if (pr.head.ref !== pr.base.ref) {
              try {
                await github.rest.git.deleteRef({
                  owner,
                  repo,
                  ref: `heads/${pr.head.ref}`
                });
                core.info(`Deleted merged head branch: ${pr.head.ref}`);
              } catch (e) {
                core.warning(`Cannot delete branch ${pr.head.ref}: ${e.message}`);
              }
            }
