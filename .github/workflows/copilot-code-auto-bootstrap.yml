name: Code Auto - Phase Bootstrap

on:
  issues:
    types: [assigned, edited, labeled, reopened]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  bootstrap:
    if: contains(github.event.issue.labels.*.name, 'code-auto')
    runs-on: ubuntu-latest
    steps:
      - name: Create phase issues and kickoff phase 1
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue = context.payload.issue;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const PHASED_LABEL = 'code-auto';
            const PHASE_LABEL = 'copilot:phase';
            const QUEUED_LABEL = 'copilot:queued';
            const READY_LABEL = 'copilot:ready';
            const parentLabel = `copilot:parent-${issue.number}`;
            const assignee = process.env.COPILOT_ASSIGNEE || 'github-copilot[bot]';
            const branchPrefix = process.env.PHASE_ACCUM_BRANCH_PREFIX || 'auto/spec-';
            const accumBranch = `${branchPrefix}${issue.number}`;

            const assignedLogins = (issue.assignees || [])
              .map(a => (a?.login || '').toLowerCase())
              .filter(Boolean);
            const isCopilotAssigned = assignedLogins.includes(assignee.toLowerCase());

            if (!isCopilotAssigned) {
              core.info(`Issue has label ${PHASED_LABEL} but is not assigned to ${assignee}. Skip.`);

              const warningMarker = '<!-- code-auto-warning:missing-assignee -->';
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number: issue.number,
                per_page: 100
              });

              const hasWarning = comments.some(c => (c.body || '').includes(warningMarker));

              if (!hasWarning) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: issue.number,
                  body: [
                    warningMarker,
                    `⚠️ \\`code-auto\\` detected but this issue is not assigned to \\`${assignee}\\`.`,
                    '',
                    'To start automation, follow this order:',
                    '1. Keep label `code-auto`',
                    `2. Assign issue to \\`${assignee}\\``,
                    '3. Ensure body has at least one `## Phase N` section',
                    '',
                    'After assignment/update, the workflow will continue automatically.'
                  ].join('\\n')
                });
              }

              return;
            }

            function parsePhases(body) {
              const text = body || '';
              const lines = text.split(/\r?\n/);
              const phases = [];
              let current = null;

              for (const line of lines) {
                const header = line.match(/^##\s*Phase\s+(\d+)\b/i);
                if (header) {
                  if (current) {
                    current.content = current.content.join('\n').trim();
                    phases.push({ number: current.number, content: current.content });
                  }

                  current = {
                    number: Number(header[1]),
                    content: []
                  };
                  continue;
                }

                if (current) {
                  current.content.push(line);
                }
              }

              if (current) {
                current.content = current.content.join('\n').trim();
                phases.push({ number: current.number, content: current.content });
              }

              phases.sort((a, b) => a.number - b.number);
              return phases;
            }

            async function ensureLabel(name, color, description) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
              } catch (e) {
                if (e.status === 404) {
                  await github.rest.issues.createLabel({ owner, repo, name, color, description });
                } else {
                  throw e;
                }
              }
            }

            const phases = parsePhases(issue.body);
            if (phases.length < 1) {
              core.info('Issue is labeled phased, but body does not contain any phase section. Skip.');

              const warningMarker = '<!-- code-auto-warning:missing-phase -->';
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number: issue.number,
                per_page: 100
              });

              const hasWarning = comments.some(c => (c.body || '').includes(warningMarker));

              if (!hasWarning) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: issue.number,
                  body: [
                    warningMarker,
                    '⚠️ `code-auto` was detected, but this issue has no phase sections.',
                    '',
                    'Please add at least one phase header in the body, for example:',
                    '',
                    '```markdown',
                    '## Phase 1',
                    '- scope ...',
                    '- acceptance criteria ...',
                    '```',
                    '',
                    'After updating the issue body, this workflow will continue automatically.'
                  ].join('\n')
                });
              }

              return;
            }

            const invalidPhases = phases.filter(p => {
              const normalized = (p.content || '').replace(/\s+/g, ' ').trim();
              return normalized.length < 10;
            });

            if (invalidPhases.length > 0) {
              core.info('One or more phases are empty or too short. Skip.');

              const warningMarker = '<!-- code-auto-warning:empty-phase -->';
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number: issue.number,
                per_page: 100
              });

              const hasWarning = comments.some(c => (c.body || '').includes(warningMarker));

              if (!hasWarning) {
                const badPhaseList = invalidPhases.map(p => `- Phase ${p.number}`).join('\n');

                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: issue.number,
                  body: [
                    warningMarker,
                    '⚠️ `code-auto` detected phase sections with missing/too-short content.',
                    '',
                    'Please add clear scope and acceptance criteria for these phases:',
                    badPhaseList,
                    '',
                    'Suggested format:',
                    '',
                    '```markdown',
                    '## Phase 1',
                    '### Scope',
                    '- ...',
                    '',
                    '### Acceptance Criteria',
                    '- [ ] ...',
                    '```',
                    '',
                    'After updating the issue body, the workflow will continue automatically.'
                  ].join('\n')
                });
              }

              return;
            }

            await ensureLabel(PHASED_LABEL, '5319E7', 'Parent issue that contains multi-phase spec');
            await ensureLabel(PHASE_LABEL, '0052CC', 'Generated phase issue for automation');
            await ensureLabel(QUEUED_LABEL, 'BFD4F2', 'Phase is queued, waiting for previous phase');
            await ensureLabel(READY_LABEL, '0E8A16', 'Phase is ready and can be executed');
            await ensureLabel(parentLabel, '6F42C1', `Generated from parent issue #${issue.number}`);

            const allExisting = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'all',
              labels: `${PHASE_LABEL},${parentLabel}`,
              per_page: 100
            });

            if (allExisting.length > 0) {
              core.info('Phase issues already exist for this parent. Skip regeneration.');
              return;
            }

            const { data: repoInfo } = await github.rest.repos.get({ owner, repo });
            const defaultBranch = repoInfo.default_branch;

            const { data: defaultRef } = await github.rest.git.getRef({
              owner,
              repo,
              ref: `heads/${defaultBranch}`
            });

            try {
              await github.rest.git.createRef({
                owner,
                repo,
                ref: `refs/heads/${accumBranch}`,
                sha: defaultRef.object.sha
              });
              core.info(`Created accumulation branch: ${accumBranch}`);
            } catch (e) {
              if (e.status === 422) {
                core.info(`Accumulation branch already exists: ${accumBranch}`);
              } else {
                throw e;
              }
            }

            const created = [];

            for (let i = 0; i < phases.length; i++) {
              const phase = phases[i];
              const phaseIndex = i + 1;
              const phaseTotal = phases.length;
              const phaseLabel = `copilot:phase-${phaseIndex}`;

              await ensureLabel(phaseLabel, 'C2E0C6', `Phase ${phaseIndex} of ${phaseTotal}`);

              const phaseBody = [
                `<!-- copilot-phase-meta`,
                `parent_issue: ${issue.number}`,
                `phase_index: ${phaseIndex}`,
                `phase_total: ${phaseTotal}`,
                `accum_branch: ${accumBranch}`,
                `default_branch: ${defaultBranch}`,
                `-->`,
                '',
                `# Phase ${phaseIndex}/${phaseTotal}`,
                '',
                `## Parent spec`,
                `- Parent issue: #${issue.number}`,
                `- Accumulation branch: \`${accumBranch}\``,
                `- Final base branch: \`${defaultBranch}\``,
                '',
                `## Phase scope`,
                phase.content || '_No additional details provided in parent issue._',
                '',
                `## Execution rules`,
                `- Open PR with base branch: \`${accumBranch}\``,
                `- Include this line in PR body: \`Phase-Issue: #${'${ISSUE_NUMBER}'}\` (replace with actual issue number)`,
                `- Keep changes strictly within this phase scope`,
                '',
                `## Checklist`,
                `- [ ] Implementation completed`,
                `- [ ] Build/tests pass for this phase`,
                `- [ ] PR opened to \`${accumBranch}\``
              ].join('\n');

              const { data: child } = await github.rest.issues.create({
                owner,
                repo,
                title: `[Phase ${phaseIndex}/${phaseTotal}] ${issue.title}`,
                body: phaseBody,
                labels: [PHASE_LABEL, QUEUED_LABEL, parentLabel, phaseLabel]
              });

              created.push({ number: child.number, phaseIndex, phaseTotal });
            }

            const first = created[0];
            if (first) {
              await github.rest.issues.removeLabel({ owner, repo, issue_number: first.number, name: QUEUED_LABEL });
              await github.rest.issues.addLabels({ owner, repo, issue_number: first.number, labels: [READY_LABEL] });

              try {
                await github.rest.issues.addAssignees({
                  owner,
                  repo,
                  issue_number: first.number,
                  assignees: [assignee]
                });
              } catch (e) {
                core.warning(`Cannot assign ${assignee} to issue #${first.number}: ${e.message}`);
              }

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: first.number,
                body: [
                  `🚀 This phase is now READY.`,
                  '',
                  `@github/copilot please implement this phase now.`,
                  `- Base branch: \`${accumBranch}\``,
                  `- Open a PR into \`${accumBranch}\``,
                  `- In PR body include: \`Phase-Issue: #${first.number}\``
                ].join('\n')
              });
            }

            const phaseList = created.map(c => `- #${c.number} (Phase ${c.phaseIndex}/${c.phaseTotal})`).join('\n');

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: issue.number,
              body: [
                `✅ Phased execution has been initialized.`,
                '',
                `- Accumulation branch: \`${accumBranch}\``,
                `- Generated phase issues:`,
                phaseList,
                '',
                `First phase has been moved to READY and kicked off automatically.`
              ].join('\n')
            });
        env:
          COPILOT_ASSIGNEE: ${{ vars.COPILOT_ASSIGNEE }}
          PHASE_ACCUM_BRANCH_PREFIX: ${{ vars.PHASE_ACCUM_BRANCH_PREFIX }}
