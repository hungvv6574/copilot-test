name: PR Stage Gate

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  stage-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate PR checklist references required stages
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || '';
            const required = [
              'BUG_CONFIRMED',
              'RCA_DONE',
              'IMPLEMENT_DONE',
              'TEST_PASS'
            ];
            const missing = required.filter(k => !body.includes(k));
            if (missing.length > 0) {
              core.setFailed(`Missing stage evidence in PR body: ${missing.join(', ')}`);
            }

      - name: Report pass
        if: success()
        run: echo "PR stage gate passed"
