name: Bug Triage Gate

on:
  issues:
    types: [opened, edited, labeled, reopened]

permissions:
  contents: read
  issues: write

jobs:
  triage:
    if: contains(github.event.issue.labels.*.name, 'type:bug') || github.event.action == 'opened'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build triage payload from issue event
        run: |
          mkdir -p .copilot-flow-kit/runtime
          node ./.copilot-flow-kit/src/issuePayloadToReport.mjs "$GITHUB_EVENT_PATH" ./.copilot-flow-kit/runtime/issue.json
          cat ./.copilot-flow-kit/runtime/issue.json

      - name: Run triage engine
        id: triage
        run: |
          node ./.copilot-flow-kit/src/cli.mjs --mode triage --input ./.copilot-flow-kit/runtime/issue.json > triage-result.json
          cat triage-result.json

      - name: Comment triage result
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const result = JSON.parse(fs.readFileSync('triage-result.json', 'utf8'));
            const status = result.triage.status;
            const reason = result.triage.reason;

            const statusLabel = {
              BUG_CONFIRMED: 'Đã xác nhận là bug',
              NEEDS_HUMAN_TRIAGE: 'Cần bổ sung thông tin trước khi kết luận',
              NOT_A_BUG: 'Không phải bug'
            }[status] ?? 'Trạng thái chưa xác định';

            const statusHelp = {
              BUG_CONFIRMED: {
                text: 'Đã đủ dấu hiệu lỗi. Có thể chuyển sang bước sửa lỗi.',
                next: 'Tạo nhánh fix và cập nhật RCA/implement/test trong PR.'
              },
              NEEDS_HUMAN_TRIAGE: {
                text: 'Thiếu dữ liệu để kết luận. Cần bổ sung thông tin issue.',
                next: 'Bổ sung bước tái hiện, expected/actual và evidence (log/video/screenshot).'
              },
              NOT_A_BUG: {
                text: 'Nhiều khả năng không phải lỗi phần mềm (đúng thiết kế/cấu hình).',
                next: 'Xác nhận lại yêu cầu nghiệp vụ hoặc cập nhật hướng dẫn sử dụng.'
              }
            }[status] ?? {
              text: 'Không xác định được trạng thái.',
              next: 'Vui lòng kiểm tra log workflow để biết chi tiết.'
            };

            const body = [
              '## Copilot Flow Triage',
              '',
              '| Field | Value |',
              '|---|---|',
              `| Status | **${statusLabel}** |`,
              `| Status code | \`${status}\` |`,
              `| Meaning | ${statusHelp.text} |`,
              `| Reason | ${reason} |`,
              `| Next action | ${statusHelp.next} |`
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

      - name: Gate for NOT_A_BUG
        run: |
          STATUS=$(node -e "const r=require('./triage-result.json');process.stdout.write(r.triage.status)")
          if [ "$STATUS" = "NOT_A_BUG" ]; then
            echo "Issue classified as NOT_A_BUG. Stopping flow."
            exit 0
          fi
